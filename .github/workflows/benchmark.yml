name: CPU Benchmark (Stock vs PR)

on:
  workflow_dispatch:
  push:
    branches: [pr/cluster-kernel-v2]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake doxygen swig
          pip install openmm numpy scipy

      - name: CPU info
        run: |
          lscpu | grep -E "Model name|CPU\(s\)|Thread|MHz"
          grep flags /proc/cpuinfo | head -1 | tr ' ' '\n' | grep -E "avx2|bmi2|fma" | sort -u

      - name: Find pip openmm paths
        id: paths
        run: |
          OPENMM_LIBS=$(python -c "import os, openmm; print(os.path.join(os.path.dirname(openmm.__file__), '..', 'OpenMM.libs', 'lib'))")
          echo "openmm_libs=$OPENMM_LIBS" >> $GITHUB_OUTPUT
          echo "OpenMM libs: $OPENMM_LIBS"
          ls $OPENMM_LIBS/plugins/

      # Stock benchmark (pip openmm as-is)
      - name: Benchmark stock
        working-directory: examples/benchmarks
        run: |
          echo "=== STOCK ==="
          md5sum ${{ steps.paths.outputs.openmm_libs }}/plugins/libOpenMMCPU.so | awk '{print "Stock hash:", $1}'
          python -u benchmark.py --platform=CPU --test=gbsa,rf,pme,apoa1rf,apoa1pme,apoa1ljpme,amoebagk,amber20-dhfr --seconds=30 | tee ../../stock_results.txt

      # Build PR
      - name: Build PR
        run: |
          mkdir build_pr && cd build_pr
          cmake .. -DOPENMM_BUILD_CPU_LIB=ON -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) OpenMM OpenMMCPU

      # Deploy PR build (override pip DLLs)
      - name: Deploy PR build
        run: |
          OPENMM_LIBS="${{ steps.paths.outputs.openmm_libs }}"
          cp build_pr/libOpenMMCPU.so $OPENMM_LIBS/plugins/libOpenMMCPU.so
          cp build_pr/libOpenMM.so $OPENMM_LIBS/libOpenMM.so
          echo "Stock hash:" && md5sum $OPENMM_LIBS/plugins/libOpenMMCPU.so.bak 2>/dev/null || true
          echo "PR hash:" && md5sum $OPENMM_LIBS/plugins/libOpenMMCPU.so

      # PR benchmark
      - name: Benchmark PR
        working-directory: examples/benchmarks
        run: |
          echo "=== PR ==="
          python -u benchmark.py --platform=CPU --test=gbsa,rf,pme,apoa1rf,apoa1pme,apoa1ljpme,amoebagk,amber20-dhfr --seconds=30 | tee ../../pr_results.txt

      # Compare
      - name: Compare results
        run: |
          echo "=== STOCK ==="
          grep -E "^test:|^ns_per_day:" stock_results.txt || echo "no stock results"
          echo ""
          echo "=== PR ==="
          grep -E "^test:|^ns_per_day:" pr_results.txt || echo "no PR results"

      # Tests
      - name: Run tests (PR)
        run: |
          cd build_pr
          export LD_LIBRARY_PATH=$(pwd)
          export OPENMM_PLUGIN_DIR=$(pwd)
          for t in TestCpuEwald TestCpuPme TestCpuSettle TestCpuNeighborList TestCpuLangevinMiddleIntegrator; do
            make -j$(nproc) $t > /dev/null 2>&1
            echo -n "$t: "
            timeout 300 ./$t > /dev/null 2>&1 && echo "PASS" || echo "FAIL"
          done
